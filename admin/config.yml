backend:
  name: git-gateway
  branch: main

# Tempat foto yang diupload dari panel admin akan disimpan
media_folder: "assets"
public_folder: "assets"

collections:
  - name: "content"
    label: "Tampilan & Kontak"
    files:
      - file: "content.json"
        label: "Teks Halaman Utama"
        name: "content"
        fields:
          - label: "Logo (kosongkan untuk pakai logo bawaan)"
            name: "logo"
            widget: "image"
            required: false
            hint: "Upload file PNG/JPG/SVG dengan background transparan untuk hasil terbaik"
          - label: "Kode QRIS untuk pembayaran"
            name: "qrisImage"
            widget: "image"
            required: false
            hint: "Upload foto/screenshot kode QRIS asli dari GoPay/DANA/m-banking. Kosongkan untuk tetap pakai contoh placeholder."
          - label: "Kalimat kecil di atas judul (hero)"
            name: "heroEyebrow"
            widget: "string"
            required: false
          - label: "Judul besar (hero)"
            name: "heroTitle"
            widget: "text"
            required: false
          - label: "Sub-judul (hero)"
            name: "heroSub"
            widget: "text"
            required: false
          - label: "Judul bagian Tentang Kami"
            name: "aboutTitle"
            widget: "string"
            required: false
          - label: "Isi teks Tentang Kami"
            name: "aboutText"
            widget: "text"
            required: false
          - label: "Alamat / area pengambilan"
            name: "address"
            widget: "string"
            required: false
          - label: "Jam layanan"
            name: "hours"
            widget: "string"
            required: false
          - label: "Username Instagram"
            name: "instagram"
            widget: "string"
            required: false
          - label: "Pesan otomatis tombol Chat WhatsApp (di bagian Kontak)"
            name: "waContactMessage"
            widget: "text"
            required: false
          - label: "Minimal hari pre-order (H- berapa hari sebelum diambil)"
            name: "preOrderLeadDays"
            widget: "number"
            value_type: "int"
            default: 2
            required: false
            hint: "Berlaku untuk produk yang ditandai Pre-Order di daftar produk"
          - label: "Catatan pre-order untuk pembeli"
            name: "preOrderNote"
            widget: "text"
            default: "Produk bertanda Pre-Order dibuat fresh setelah pesanan masuk, jadi butuh waktu produksi. Pesan lebih awal ya supaya bisa diambil tepat waktu."
            required: false
          - label: "Aktifkan bagian Reservasi/Pre-Booking?"
            name: "reservationEnabled"
            widget: "boolean"
            default: false
            required: false
            hint: "Nyalakan menjelang musim ramai seperti Ramadan/Lebaran, matikan lagi kalau sudah tidak perlu"
          - label: "Judul bagian Reservasi"
            name: "reservationTitle"
            widget: "string"
            required: false
            default: "Reservasi Kue Lebaran"
          - label: "Deskripsi bagian Reservasi"
            name: "reservationDesc"
            widget: "text"
            required: false
            default: "Isi form ini untuk menandai kue yang kamu minati beserta tanggal pengambilannya. Ini baru catatan minat, belum termasuk pembayaran — nanti kami hubungi balik untuk konfirmasi."
          - label: "Catatan kecil di bawah tombol kirim"
            name: "reservationNote"
            widget: "string"
            required: false
            default: "Reservasi ini belum termasuk pembayaran."

  - name: "products"
    label: "Produk & Kontak"
    files:
      - file: "products.json"
        label: "Kelola Produk"
        name: "products"
        fields:
          - label: "Nomor WhatsApp Toko"
            name: "whatsapp"
            widget: "string"
            hint: "Format: 62 lalu nomor tanpa 0 di depan, contoh 6281234567890"
          - label: "Daftar Produk"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — Rp{{fields.price}}"
            fields:
              - label: "ID (unik, huruf kecil, tanpa spasi)"
                name: "id"
                widget: "string"
              - label: "Nama Produk"
                name: "name"
                widget: "string"
              - label: "Harga (angka saja)"
                name: "price"
                widget: "number"
                value_type: "int"
              - label: "Satuan"
                name: "unit"
                widget: "string"
                default: "toples 250 gr"
              - label: "Deskripsi Singkat"
                name: "desc"
                widget: "text"
              - label: "Foto Produk"
                name: "image"
                widget: "image"
                required: false
              - label: "Produk Pre-Order?"
                name: "isPreOrder"
                widget: "boolean"
                default: false
                required: false
                hint: "Aktifkan kalau produk ini baru dibuat setelah ada pesanan (butuh waktu produksi)"
              - label: "Lama waktu pre-order khusus produk ini (hari)"
                name: "leadTimeDays"
                widget: "number"
                value_type: "int"
                required: false
                hint: "Kosongkan untuk pakai default global dari Tampilan & Kontak. Isi kalau produk ini butuh waktu beda, misal 3 atau 5 hari."
